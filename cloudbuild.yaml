steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/assistant/assistant:$_TAG
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/assistant/assistant:$_TAG

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - personal-assistant
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/assistant/assistant:$_TAG
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=3
      # multi-user: keep serving Telegram webhooks while a /run is in progress
      - --concurrency=10
      - --cpu=1
      - --memory=512Mi
      - --timeout=300
      - --set-env-vars=^|^PROJECT_ID=$PROJECT_ID|REGION=${_REGION}|TELEGRAM_BOT_TOKEN=${_TELEGRAM_BOT_TOKEN}|GEMINI_API_KEY=${_GEMINI_API_KEY}|GEMINI_MODEL=${_GEMINI_MODEL}|DEEPSEEK_API_KEY=${_DEEPSEEK_API_KEY}|DEEPSEEK_API_URL=${_DEEPSEEK_API_URL}|DEEPSEEK_MODEL=${_DEEPSEEK_MODEL}|OPENAI_API_KEY=${_OPENAI_API_KEY}|OPENAI_MODEL=${_OPENAI_MODEL}|GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID}|GOOGLE_CLIENT_SECRET=${_GOOGLE_CLIENT_SECRET}|TOKEN_ENCRYPTION_KEY=${_TOKEN_ENCRYPTION_KEY}|TELEGRAM_WEBHOOK_SECRET=${_TELEGRAM_WEBHOOK_SECRET}|RUN_SECRET=${_RUN_SECRET}|PUBLIC_URL=${_PUBLIC_URL}|ADMIN_TELEGRAM_ID=${_ADMIN_TELEGRAM_ID}|TELEGRAM_BOT_USERNAME=${_TELEGRAM_BOT_USERNAME}|USER_TOKEN_LIMIT=${_USER_TOKEN_LIMIT}|USER_EMAIL_LIMIT=${_USER_EMAIL_LIMIT}|LIMIT_ADMINS=${_LIMIT_ADMINS}

substitutions:
  _REGION: us-central1
  _TAG: latest
  _TELEGRAM_BOT_TOKEN: ""
  # Empty values fall back to the defaults in src/config.py.
  # LLM: the first provider with a key is used (Gemini -> DeepSeek -> OpenAI)
  _GEMINI_API_KEY: ""
  _GEMINI_MODEL: ""
  _DEEPSEEK_API_KEY: ""
  _DEEPSEEK_API_URL: "https://opencode.ai/zen/go/v1/chat/completions"
  _DEEPSEEK_MODEL: ""
  _OPENAI_API_KEY: ""
  _OPENAI_MODEL: ""
  _GOOGLE_CLIENT_ID: ""
  _GOOGLE_CLIENT_SECRET: ""
  _TOKEN_ENCRYPTION_KEY: ""
  _TELEGRAM_WEBHOOK_SECRET: ""
  _RUN_SECRET: ""
  _PUBLIC_URL: ""
  _ADMIN_TELEGRAM_ID: ""
  _TELEGRAM_BOT_USERNAME: ""
  _USER_TOKEN_LIMIT: ""
  _USER_EMAIL_LIMIT: ""
  _LIMIT_ADMINS: ""

options:
  logging: CLOUD_LOGGING_ONLY
